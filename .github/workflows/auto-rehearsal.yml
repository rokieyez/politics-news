name: 구독 자동 답하기 시험

# 아침 데일리를 그대로 한 번 돌리고 이어서 구독으로 답하되, 결과를 **임시 폴더**에 두고 커밋·알림을 하지 않는다.
# 구독 토큰(CLAUDE_CODE_OAUTH_TOKEN)이 살아 있는지, 답이 끝까지 글·카드·대본이 되는지 확인할 때 쓴다.
# 토큰은 1년짜리라 갱신한 뒤에도 이걸로 확인하면 된다. 구독 사용량을 하루치만큼 쓴다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성·글꼴·Claude Code
        run: |
          pip install -q -r requirements.txt
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install -g --silent @anthropic-ai/claude-code >/dev/null 2>&1
          echo "Claude Code $(claude --version)"

      - name: 임시 설정 (산출물은 임시 폴더)
        run: |
          cp -r config "$RUNNER_TEMP/cfg"
          python - <<'PY'
          import os, yaml
          p = os.path.join(os.environ["RUNNER_TEMP"], "cfg", "settings.yaml")
          s = yaml.safe_load(open(p, encoding="utf-8"))
          s.setdefault("output", {})["dir"] = os.path.join(os.environ["RUNNER_TEMP"], "out")
          s.setdefault("auto", {})["enabled"] = True
          yaml.safe_dump(s, open(p, "w", encoding="utf-8"), allow_unicode=True)
          PY

      - name: 아침 실행 (묶음 만들기)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python -m rebrief --config "$RUNNER_TEMP/cfg" -v run --date "$(TZ=Asia/Seoul date +%F)"

      - name: 구독으로 답하기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python -m rebrief --config "$RUNNER_TEMP/cfg" -v auto --date "$(TZ=Asia/Seoul date +%F)"

      - name: 결과
        if: always()
        run: |
          D="$RUNNER_TEMP/out/$(TZ=Asia/Seoul date +%F)"
          {
            echo "## 점검표"; cat "$D/checklist.md" 2>/dev/null | sed -n '1,25p'
            echo "## 파일"; echo '```'; ls -1 "$D" 2>/dev/null | grep -v '^raw$'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -f "$D/blog-naver.html" && test -f "$D/script-longform.md"
