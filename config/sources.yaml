# ─────────────────────────────────────────────────────────────
# 키워드 사전 — 이슈 점수와 카테고리 분류에 사용
# terms 중 하나라도 제목/요약에 들어가면 weight 만큼 점수를 더합니다.
# ─────────────────────────────────────────────────────────────
keywords:
  국회·입법:
    weight: 3.0
    terms: [본회의, 상임위, 법사위, 운영위, 법안, 개정안, 제정안, 입법, 필리버스터,
            패스트트랙, 국정감사, 국감, 인사청문회, 청문회, 탄핵소추, 탄핵, 국정조사,
            예산안, 추경, 국회의장, 원내대표]

  정당·공천:
    weight: 2.8
    terms: [국민의힘, 더불어민주당, 민주당, 조국혁신당, 개혁신당, 진보당, 당대표, 최고위원,
            전당대회, 공천, 경선, 탈당, 입당, 합당, 창당, 당원, 계파, 친윤, 친명, 비명, 비윤]

  대통령실·정부:
    weight: 2.8
    terms: [대통령, 대통령실, 국무회의, 개각, 국무총리, 총리, 장관 후보자, 장관 내정,
            거부권, 재의요구, 시정연설, 담화, 기자회견, 비서실장, 정무수석]

  선거·여론조사:
    weight: 2.5
    terms: [지지율, 여론조사, 갤럽, 리얼미터, 엔비에스, NBS, 총선, 대선, 지방선거,
            보궐선거, 재보궐, 선관위, 선거관리위원회, 선거법, 출마, 후보]

  사법·수사:
    weight: 2.2
    terms: [특검, 특별검사, 검찰, 공수처, 영장, 구속, 기소, 헌법재판소, 헌재, 대법원,
            수사, 압수수색, 소환]

  지방정치:
    weight: 1.5
    terms: [서울시장, 경기지사, 도지사, 시장 선거, 시의회, 도의회, 지자체장, 구청장]

  외교·안보:
    weight: 1.2
    terms: [한미, 한일, 한중, 북한, 국방부, 통일부, 외교부, 정상회담, 방위비]

# 제목이나 요약에 이 단어가 있으면 버립니다.
exclude_terms:
  - 부고
  - 포토
  - 카드뉴스
  - 오늘의 운세
  - 신간
  - 협찬
  - 이벤트 당첨

  # 도박·코인 SEO 스팸. 구글뉴스가 키워드 검색에 이런 글을 섞어 냅니다.
  # (estate-news 에서 수집 214건 중 26건(12%)이 이 부류였습니다.)
  - 토토
  - 카지노
  - 바카라
  - 슬롯
  - 도박
  - 배팅
  - 베팅
  - 먹튀
  - 파워볼
  - 홀덤
  - 블랙잭
  - 룰렛
  - 경마
  - 맞고 사는
  - 플러시
  - 사행성
  - 꽁머니
  - 환전상
  - 바이 비트
  - 선물거래
  - 코인 거래소

# 단어만으로는 애매할 때 쓰는 정규식. 위 목록과 같은 방식으로 걸러냅니다.
exclude_patterns:
  # '포커'는 막고 싶지만 기사 말머리 '[MD포커스]'까지 걸리면 안 됩니다.
  - "포커(?!스)"
  # 인사 발령 알림([인사] ○○부)은 버리되, '인사청문회'·'인사 개편' 기사는 살립니다.
  # estate-news 처럼 낱말 '인사' 를 통째로 막으면 청문회 기사가 다 빠집니다.
  - "^\\[인사\\]"
  - "\\[부고\\]"

# 이 중 하나라도 없으면 정치 기사가 아닌 것으로 보고 버립니다.
#
# 비워 두는 것이 기본값입니다. estate-news 에서 화이트리스트를 채워 봤더니 멀쩡한 기사가
# 30건 넘게 같이 걸렸습니다. 스팸은 위 금지어만으로 충분히 잡힙니다.
# 특정 분야만 좁게 다루고 싶을 때만 채우세요. 예: [국회, 법안, 상임위]
require_terms: []

# 제목 앞의 이 태그들은 "속보성"으로 보고 가점을 줍니다.
breaking_tags: ["단독", "속보", "1보"]
