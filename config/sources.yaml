# ─────────────────────────────────────────────────────────────
# 수집 소스 설정
#
#  · enabled: false 로 바꾸면 해당 피드를 건너뜁니다.
#  · weight  : 이슈 점수 계산에 쓰는 매체 가중치 (1.0 기준)
#  · 피드가 살아있는지 확인:  python -m rebrief doctor
#    죽은 피드는 enabled: false 로 꺼두면 됩니다.
#
#  **매체 가중치는 정치 성향을 따라 기울이지 않습니다.** 통신사(연합·뉴시스)만 사실 전달
#  비중이 커서 조금 높고, 나머지 신문·방송은 성향과 무관하게 같은 값입니다. 가중치로
#  어느 한쪽 보도를 키우면 브리핑이 그쪽으로 기웁니다 — 이 프로젝트가 가장 피해야 할 일입니다.
# ─────────────────────────────────────────────────────────────

feeds:
