# ─────────────────────────────────────────────────────────────
# 파이프라인 설정
# ─────────────────────────────────────────────────────────────

run:
  timezone: Asia/Seoul
  lookback_hours: 28        # 몇 시간 전 기사까지 볼지 (오전 실행 기준 어제 아침부터)
  max_articles: 500         # 수집 상한. 정치는 하루 900건이 넘어 300 이면 잘립니다 (2026-09-08 실측)
  max_issues: 5             # 하루에 다룰 이슈 개수
  min_cluster_size: 1       # 이슈로 올릴 최소 보도 건수 (2로 올리면 단독 기사 제외)
  skip_recent_days: 3       # 최근 N일 안에 이미 다룬 기사는 제외 (재탕 방지)
  repeat_lookback_days: 7   # 며칠 전까지의 이슈 제목과 견줘 '같은 주제 반복' 을 알릴지

  # 한산한 날은 글을 만들지 않습니다. 큰 사건이면 반드시 여러 매체가 받아쓰므로,
  # '여러 곳이 함께 다룬 이야기' 가 없으면 조용한 날로 봅니다. 비용도 줄지만, 억지로 채운
  # 잔뉴스 글이 유사문서로 몰리는 걸 막는 쪽이 더 큰 이유입니다.
  # 통계 수집은 그대로 돌아가고, prompt-pack.md 도 남으니 마음이 바뀌면 손으로 만들 수 있습니다.
  quiet_day:
    enabled: true
    min_top_size: 3         # 가장 많이 보도된 이슈가 이 건수 미만이면 조용한 날 후보
    min_covered: 2          # 2개 매체 이상이 다룬 이슈가 이만큼 있으면 그냥 만듭니다

collect:
  timeout_seconds: 15
  max_workers: 8
  fetch_body: true          # 언론사 직접 링크는 본문까지 긁어옴 (요약 품질↑)
  fetch_body_top_n: 20      # 상위 N개 기사만 본문 수집 (속도/차단 고려)
  body_max_chars: 4000
  user_agent: "Mozilla/5.0 (compatible; rebrief/1.0; +https://github.com/rokieyez/politics-news)"
  check_links: true         # 선정된 이슈의 기사 링크가 열리는지 HEAD 요청으로 확인
  check_links_max: 60       # 점검할 링크 상한 (시간 고려)

cluster:
  # 제목 유사도(글자 2-gram Dice) 임계값. 이 값 이상이면 같은 사건으로 봅니다.
  #   0.35 (기본) — 같은 사건을 놓치지 않는 쪽. 가끔 인접 기사가 함께 묶입니다.
  #   0.45 이상   — 정밀하게. 대신 같은 사건이 두 꼭지로 갈릴 수 있습니다.
  # 실측: 같은 사건 0.35~0.69 / 다른 사건 0.00~0.40 (두 구간이 살짝 겹칩니다)
  similarity_threshold: 0.35

rank:
  # 이슈 점수 가중치
  volume: 3.0        # 여러 매체가 동시에 보도 = 핫이슈
  volume_cap: 8      # 보도 매체 수를 이 값까지만 인정 (보도자료 물량공세 방지)
  keyword: 1.0       # 키워드 사전 매칭
  recency: 1.5       # 최신성
  source: 0.8        # 매체 가중치
  breaking: 1.2      # [단독]/[속보] 가점

# 구독으로 묶음 답하기 (2026-09-11). 붙여넣기 묶음이 남은 날(위 llm 이 꺼져 있거나 브리핑부터 막힌 날)에만 돕니다.
# 러너 안의 Claude Code 가 묶음에 답하고, 「답 받기」와 같은 처리로 글·카드·대본을 만듭니다.
# 저장소 Secret CLAUDE_CODE_OAUTH_TOKEN(맥에서 `claude setup-token`, 1년짜리)이 있어야 돌고, API 요금이 아니라
# 구독 사용량으로 처리됩니다. 한도·만료로 멈추면 텔레그램으로 알리고, 그날은 예전처럼 사람이 붙여 넣습니다.
auto:
  enabled: true
  model: ""                 # 비우면 llm.model. 한도·권한 오류면 llm.fallback_model 로 한 번 더
  max_output_tokens: 64000  # 세 덩이를 한 번에 쓰므로 넉넉히 (CLI 가 모델 상한으로 알아서 줄임)
  timeout_seconds: 1500     # 한 번 묻는 데 기다리는 상한

llm:
  # 예전(API) 길 그대로, 모델만 구독 토큰으로 부릅니다 (2026-09-11 사용자 "예전처럼 … 크레딧 차감 없이
  # 자체 토큰만으로"). 브리핑·블로그·대본·정부 발표 요약·금지 표현 고쳐쓰기·주간/월간 결산·인물 조사 --llm 모두.
  # false 로 두면 0원 방식(묶음만 만들고 사람이 claude.ai 에 붙여 넣기)으로 돌아갑니다.
  enabled: true
  # 무엇으로 부를지.
  #   subscription — 구독(Pro/Max) 토큰으로 Claude Code 를 부른다. API 요금 0원.
  #                  저장소 Secret CLAUDE_CODE_OAUTH_TOKEN (맥에서 `claude setup-token`, 1년짜리).
  #                  토큰이 없으면 API 키가 있어도 **쓰지 않는다** — 요금이 다시 나가지 않게.
  #   api          — ANTHROPIC_API_KEY 로 부른다 (하루 약 $0.5, 잔액 필요).
  # 구독이 한도·만료로 브리핑부터 막히면 붙여넣기 묶음을 남기고 아래 auto 가 한 번 더 해 본 뒤 텔레그램으로 알립니다.
  transport: subscription
  model: claude-opus-5      # 바꾸려면: claude-sonnet-5 (더 저렴), claude-haiku-4-5
  effort: high              # low | medium | high | xhigh | max
  max_tokens: 16000
  # 영상 대본만 한도를 크게. 출력이 가장 크고 생각 토큰까지 같은 한도를 나눠 씁니다.
  # 2026-09-08 아침 실행이 16,000 에 걸려 JSON 이 문장 중간에서 잘렸습니다.
  # 상한일 뿐이라 올려도 실제로 쓴 만큼만 돈이 나갑니다.
  script_max_tokens: 32000
  timeout_seconds: 600
  krw_per_usd: 1400         # INDEX.md 비용 표시에 쓰는 환율 (대략값)
  # 영상 대본만 다른(값싼) 모델로. 출력 토큰이 가장 많은 호출이라 하루 비용이 크게 준다.
  # 비우면 위 model 을 그대로 씁니다.
  script_model: claude-sonnet-5

  # 브리핑도 값싼 모델로. 새 글을 쓰는 게 아니라 기사를 '정리' 하는 일입니다.
  # 2026-09-07 실측에서 출력 비용의 37%가 이 호출이었습니다. 품질이 눈에 띄게 떨어지면
  # 이 줄을 비우세요 (비우면 위 model 을 그대로 씁니다).
  brief_model: claude-sonnet-5

  policy_model: claude-haiku-4-5   # 정부 보도자료 3줄 요약용 (짧은 작업이라 가장 싼 모델로)

  fallback_model: claude-sonnet-5   # 한도·장애로 실패하면 이 모델로 한 번 더 (비우면 안 함)
  monthly_budget_usd: 0     # 월 예산(달러). 0 이면 제한 없음. 80% 넘으면 fallback_model 로, 넘으면 건너뜀
  budget_soft_ratio: 0.8

images:
  enabled: true             # 수치를 인포그래픽 SVG 로 자동 생성
  max: 3                    # 하루 최대 장수 (블로그 이미지 자리 수에 맞춤)
  png: true                 # 네이버에 올리려면 PNG 가 필요합니다 (크롬이 있을 때만 변환)
  png_scale: 2              # 2배 해상도 (블로그 본문 그림·썸네일)
  # 통계 그림은 사이트에서 참고로 보는 자료라 1배(약 1000px)로 충분합니다. 2배로 두면 파일이
  # 정확히 두 배가 되고, 이 그림들은 날마다 새로 커밋됩니다 (2026-09-07 실측: 지도 208KB→104KB).
  png_scale_stats: 1
  # 카드뉴스는 1080×1080 이 유튜브 게시물의 최종 크기라 1배로 뽑습니다. 2배(2160)는 장당
  # 1~2MB 가 날마다 쌓이는데 유튜브가 어차피 줄여서 보여 줍니다 (2026-09-08 실측: 하루 6.4MB).
  png_scale_cards: 1
  # PNG 로 바뀐 뒤에는 SVG 를 남기지 않습니다. 같은 그림이 두 벌씩 매일 쌓이기 때문입니다.
  # 크롬이 없어 변환에 실패한 날은 SVG 가 그대로 남습니다 (그날은 그것뿐이라서).
  keep_svg: false
  cover: true               # 글 맨 위에 올릴 표지 이미지 (검색 목록 썸네일)
  thumbnails: true          # 롱폼(1280×720)·쇼츠(1080×1920) 표지 이미지
  thumbnail_variants: 2     # 썸네일 문구 후보 몇 개까지 그릴지 (1안·2안)
  # 카드뉴스 — 유튜브 커뮤니티 게시물에 그대로 올리는 정사각 이미지 묶음.
  # 이미 만든 브리핑을 나눠 담는 것이라 **모델을 새로 부르지 않습니다** (하루 비용 그대로).
  cards: true
  # 장수는 그날 내용이 정합니다. 이슈가 많으면 늘고 적으면 줄어듭니다.
  # 이 값은 **상한일 뿐 목표가 아닙니다** — 억지로 채우지 않습니다 (보통 5~9장).
  cards_max: 10
  # 표지·이슈 카드 위쪽에 그림을 얹습니다.
  # 차례: 손으로 넣은 photo-1.jpg → 무료 사진(Pexels) → 그날 그린 인포그래픽.
  # 기사 사진은 쓰지 않습니다 — 저작권이 있고 수집하지도 않습니다.
  cards_art: true
  # 무료 사진(Pexels). PEXELS_API_KEY 가 있어야 돌고, 없으면 조용히 건너뜁니다.
  # 받은 사진은 state/photos/ 에만 두고 저장소에는 올리지 않습니다(한 장 3~6MB).
  photos: true
  # 장수는 표지 1 + 이슈 카드 수로 그날 정해집니다. 이 값은 상한일 뿐입니다 (2026-09-09: 4장이라
  # 이슈 카드 5·6번이 글자만 있었음 → 10). 사진은 저장소에 안 올라가니 장수가 늘어도 커밋은 안 큽니다.
  photos_max: 10

verify:
  numbers: true             # 브리핑 수치가 기사 제목·본문에 실제로 있는지 대조 (LLM 호출 없음)

checklist:
  autofix_model: claude-haiku-4-5   # 금지 표현이 든 문장을 이 모델로 고쳐 씀 (비우면 안 함, 몇 원 수준)

site:
  url: "https://www.rokiz.net/politics-news/"   # 알림 메시지에 붙는 사이트 주소
  repo: rokieyez/politics-news                    # 붙여넣기 묶음 페이지의 「답 붙여 넣을 곳」(깃허브 이슈) 주소에 씀

output:
  dir: output
  keep_raw: true            # 수집 원본 JSON 을 내 컴퓨터에 보관 (커밋은 안 됨 — 기사 본문이 들어 있어서)
  write_index: true         # output/INDEX.md 갱신

# ─────────────────────────────────────────────────────────────
# 영상 제작용 설정 — 여기를 본인 채널에 맞게 고치는 게 핵심입니다.
# ─────────────────────────────────────────────────────────────
video:
  channel_name: "방구석 배경지식"          # 채널 이름 (2026-09-08 사용자 확정)
  audience: "뉴스는 보지만 정치 용어와 국회 절차가 낯선 20~50대 유권자"
  tone: "차분하고 담담한 사실 전달. 어느 정당·인물의 편도 들지 않는다. 양쪽 주장은 나란히 싣고, 사실과 주장을 구분해 쓴다."
  persona: "정치 뉴스를 풀어 주는 진행자. 누가 무엇을 했는지, 절차상 다음이 무엇인지 설명하되 옳고 그름을 판정하지 않는다."
  shorts_seconds: 60        # 쇼츠 목표 길이
  longform_minutes: 8       # 롱폼 목표 길이
  speaking_rate_cpm: 330    # 분당 발화 글자 수(한국어 기준) — 대본 길이 계산에 사용
  caption_max_chars: 16     # SRT 자막 한 줄 최대 글자 (세로 화면 기준)
  caption_max_lines: 2      # 한 컷에 보여 줄 최대 줄 수
  cut_list_fps: 30          # 컷 리스트 타임코드(HH:MM:SS:FF)의 초당 프레임

  # 대본·글에 쓰면 안 되는 표현. **한쪽 진영이 상대를 부르는 말**이 대부분입니다 — 이 말이
  # 하나라도 들어가면 채널이 그쪽 편으로 읽힙니다. 점검표(checklist)가 실제로 검사합니다.
  banned_phrases:
    - "빨갱이"
    - "종북"
    - "토착왜구"
    - "수구"
    - "극우"
    - "극좌"
    - "좌빨"
    - "일베"
    - "대깨"
    - "개딸"
    - "내로남불"
    - "국정농단 세력"
    - "독재"
    - "매국"
  cta: "도움이 되셨다면 구독과 알림 설정 부탁드립니다."

# ── 통계 (estate-news 에서 물려받은 부동산 실거래·부동산원 모듈) ──────────────────
# **정치 뉴스에는 쓸 데가 없어 꺼 두었습니다.** 코드는 남아 있지만 돌지 않습니다.
# 정치용 '직접 센 숫자' 는 따로 만들어야 합니다 — 후보: 국회 의안정보(열린국회정보 API),
# 중앙선거여론조사심의위원회 등록 여론조사, 선관위 선거통계. CLAUDE.md 의 '다음에 할 일' 참고.
stats:
  enabled: false

# ── 국회·여론조사 직접 집계 — 정치용 '직접 센 숫자' (rebrief/civics.py) ──
# 열린국회정보(발의 법률안·본회의 처리)와 선거여론조사심의위 등록부를 직접 읽습니다.
# 열린국회정보 인증키 ASSEMBLY_API_KEY 는 선택입니다. 없으면 견본 모드(한 번에 5건)라 기간 안의
# 건수는 못 세고 최근 5건만 보여 줍니다. open.assembly.go.kr 회원가입 → 마이페이지 → 인증키 신청(무료).
civics:
  enabled: true
  days: 7                   # 며칠치 발의·처리·등록을 볼지
  polls_max: 8              # 상세 화면을 열어 볼 여론조사 수 (한 건에 한 번 접속)

# ── 선거 달력 — 선거일 전 6일부터 투표 마감까지 새 여론조사 결과를 공표·인용할 수 없습니다 ──
# (공직선거법 108조 ①). 이 기간에 글이 여론조사 수치를 담으면 점검표가 ❌ 로 막습니다.
# 보궐선거가 잡히면 한 줄 더 적으세요. 예: - {name: 2027년 상반기 재보궐선거, date: "2027-04-07"}
elections:
  - {name: 제23대 국회의원선거, date: "2028-04-12"}

# ── 균형 검사 — 글에서 두 진영의 언급 수를 셉니다. 한쪽이 max_share 를 넘으면 점검표에 ⚠️ ──
# 별칭은 정권에 따라 바뀝니다(여당·야당). 2026-09 기준 여당은 더불어민주당입니다.
balance:
  min_total: 6              # 언급 합이 이보다 적으면 재지 않습니다 (짧은 글에서 오탐 방지)
  max_share: 0.75
  sides:
    더불어민주당: [더불어민주당, 민주당, 여당]
    국민의힘: [국민의힘, 국힘, 야당]

policy:
  enabled: true
  lookback_days: 2          # 며칠 전 발표까지 볼지
  max_docs: 3               # 하루에 실을 최대 건수
  download: true            # 원본 파일을 내려받아 함께 보관 (끄면 링크만)
  max_file_mb: 5            # 이보다 큰 첨부는 건너뜁니다 (원본 파일은 매일 저장소에 쌓입니다)
  max_files_per_doc: 1      # 한 건당 받을 파일 수 (PDF 우선). 늘리면 저장소가 빨리 커집니다
  list_pages: 4             # 목록을 몇 장까지 넘겨볼지 (한 장에 20건)
  # 정책브리핑(korea.kr)은 행정부 발표만 모입니다. 국회·정당·선관위 발표는 여기 없습니다.
  # 제목에 아래 강한 말(국무회의·개각 등, policy.py 의 STRONG)이 있으면 부처와 무관하게 싣습니다.
  departments: [대통령실, 국무조정실, 국무총리비서실, 행정안전부, 법무부, 법제처, 인사혁신처]
  keywords: [국무회의, 국회, 법률안, 법안, 개정안, 시행령, 개각, 임명, 인사, 담화, 지시,
             총리, 장관, 선거, 국정과제, 국정감사, 재의요구, 공포]

blog:
  # 발행 플랫폼. 글의 문체와 산출 파일이 달라집니다.
  #   naver    — 네이버 블로그. blog-naver.html(붙여넣기용) 을 추가로 만듭니다.
  #   markdown — 티스토리/워드프레스/깃허브 등 범용 마크다운
  platform: naver

  max_sentence_chars: 90    # 이보다 긴 문장은 점검표에 올림
  max_paragraph_chars: 320  # 이보다 긴 문단은 점검표에 올림

  # 짧게 씁니다. 이슈 5개를 다 설명하면 3천 자가 넘고 아무도 끝까지 읽지 않습니다.
  # 메인 1개만 깊게 쓰고 나머지는 '그 밖의 오늘 소식' 에 한 줄씩 (프롬프트 규칙).
  min_chars: 1200
  max_chars: 2000
  frontmatter: true         # blog.md 에 YAML 머리말 포함 (Jekyll/Hugo/Obsidian 호환)
  category: "정치"
  disclaimer: "본 글은 공개된 언론 보도를 정리한 것이며, 특정 정당·후보·인물을 지지하거나 반대하지 않습니다. 인용한 여론조사의 자세한 사항은 중앙선거여론조사심의위원회 홈페이지를 참조하세요."
  highlight_repeats: 3      # 같은 수치(10%, 3억원…)가 이 횟수 이상 나오면 네이버 글에서 형광펜. 0 이면 끔
  related_posts: 3          # 글 끝에 붙일 지난 글 개수 (발행 기록에 주소가 있는 날만). 0 이면 끔
  overlap_lookback_days: 3  # 며칠 전 글까지 문장 겹침을 볼지
  max_overlap_ratio: 0.15   # 지난 글과 같은 문장이 이 비율을 넘으면 점검표에 올림
  glossary_max: 3           # 글 앞에 붙일 '낯선 말 풀이' 개수. 0 이면 끔
  key_numbers: 3            # '오늘의 숫자' 카드에 넣을 핵심 수치 개수. 본문 강조·썸네일 배지에도 쓴다. 0 이면 끔

  naver:
    fixed_tags: [정치, 정치뉴스, 국회, 정치브리핑, 오늘의정치]   # 태그 30칸을 채울 고정 태그
    tag_count: 30           # 본문 하단 해시태그 개수 (네이버 상한. 모자라면 지역·고정 태그로 채웁니다)
    image_slots: 3          # 본문에 넣을 이미지 자리 개수
    paragraph_max_chars: 120  # 문단 최대 길이. 모바일에서 읽히려면 짧아야 합니다.

    # 붙여넣기 화면의 '네이버 글쓰기 열기' 버튼이 갈 주소.
    # 내 블로그에서 '글쓰기'를 누른 뒤, 주소창에 뜬 주소를 그대로 붙여넣으세요.
    # 비워 두면 네이버 블로그 첫 화면으로 갑니다. 정치용 블로그는 따로 만들었습니다 (2026-09-08).
    write_url: "https://blog.naver.com/keyboardpolitics?Redirect=Write&"

# ── 인물 조사 (`python -m rebrief profile "이름"`) ──────────────
# 정치인 한 사람의 배경지식(누구인지·어떤 길을 걸어왔는지)을 영상용으로 정리합니다.
# 열린국회정보 인적사항·발의법률안, 위키백과, 구글뉴스 시기별 기사 제목을 모아 모델에 줍니다.
profile:
  # 전기는 모델이 '기억으로' 쓰기 쉬운 글이라 기본(강한) 모델을 씁니다. 비우면 llm.model.
  model: ""
  max_tokens: 32000
  news_span_years: 4       # 시기별 기사 검색을 몇 해씩 자를지 (창이 10개를 넘으면 자동으로 넓힘)
  news_per_window: 30      # 시기마다 남길 기사 제목 수
  news_recent: 40          # 최근 기사 제목 수
